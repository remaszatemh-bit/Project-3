{% extends "auctions/layout.html" %}
{% block body %}
<div class="row justify-content-center">
 <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm border-0 rounded-4">
      <div class="card-body p-4 text-center">
        <h3 class="fw-bold text-danger mb-3">Delete this listing?</h3>
        <p class="text-muted mb-4">
          You are about to permanently delete
          <strong>"{{ listing.title }}"</strong>.<br>
          All bids and comments on it will be removed too. This cannot be undone.
        </p>

        <form method="POST" class="d-flex gap-2 justify-content-center">
          {% csrf_token %}
          <a href="{% url 'listing' listing.id %}" class="btn btn-outline-secondary px-4">Cancel</a>
          <button type="submit" class="btn btn-danger px-4">Yes, delete it</button>
        </form>
      </div>
    </div>
 </div>
</div>
{% endblock %}
