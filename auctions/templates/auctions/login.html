{% extends "auctions/layout.html" %}

{% block body %}

    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            <div class="card page-card mt-4">
                <div class="card-body p-4">
                    <h4 class="card-title mb-3 text-center">Login</h4>

                    {% if message %}
                        <div class="alert alert-danger py-2">{{ message }}</div>
                    {% endif %}

                    <form action="{% url 'login' %}" method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label small text-muted">Username</label>
                            <input autofocus class="form-control" id="username" type="text" name="username" placeholder="Enter your username">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label small text-muted">Password</label>
                            <input class="form-control" id="password" type="password" name="password" placeholder="Enter your password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>

                    <p class="text-center small text-muted mt-3 mb-0">
                        Don't have an account? <a href="{% url 'register' %}">Register here.</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
