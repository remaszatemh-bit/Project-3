{% extends "auctions/layout.html" %}

{% block body %}

    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            <div class="card page-card mt-4">
                <div class="card-body p-4">
                    <h4 class="card-title mb-3 text-center">Register</h4>

                    {% if message %}
                        <div class="alert alert-danger py-2">{{ message }}</div>
                    {% endif %}

                    <form action="{% url 'register' %}" method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="username" class="form-label small text-muted">Username</label>
                            <input class="form-control" autofocus id="username" type="text" name="username" placeholder="Choose a username">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label small text-muted">Email</label>
                            <input class="form-control" id="email" type="email" name="email" placeholder="you@example.com">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label small text-muted">Password</label>
                            <input class="form-control" id="password" type="password" name="password" placeholder="Choose a password">
                        </div>
                        <div class="mb-3">
                            <label for="confirmation" class="form-label small text-muted">Confirm Password</label>
                            <input class="form-control" id="confirmation" type="password" name="confirmation" placeholder="Repeat your password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Register</button>
                    </form>

                    <p class="text-center small text-muted mt-3 mb-0">
                        Already have an account? <a href="{% url 'login' %}">Log In here.</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
